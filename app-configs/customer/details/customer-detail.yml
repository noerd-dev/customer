title: Customer Details
description: ''
tabs:
  - number: 1
    label: Master Data
  - label: Addresses
    component: customer-addresses-list
    arguments:
      customerId: $modelId
    requiresId: true
  - number: 2
    label: Activity Log
    requiresId: true
actions:
  - label: New Address
    route: customer.address.detail
    heroicon: plus
fields:
  - name: detailData.name
    label: Name
    type: text
    colspan: 6
    required: true
  - name: detailData.company_name
    label: Company
    type: text
    colspan: 6
  - name: detailData.email
    label: Email
    type: email
    colspan: 6
  - name: detailData.phone
    label: Phone
    type: phone
    colspan: 6
  - name: detailData.default_invoice_address_id
    label: Default Invoice Address
    type: customerAddressCardRelation
    colspan: 6
  - name: detailData.default_delivery_address_id
    label: Default Delivery Address
    type: customerAddressCardRelation
    colspan: 6
  - name: detailData.internal_comment
    label: Internal Comment
    type: textarea
    colspan: 12
